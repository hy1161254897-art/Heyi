<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111d" />
    <title>压裂工程数字工作台 · 贺某制做</title>
    <meta
      name="description"
      content="集成裂缝三维模拟、施工曲线多指标分析与停泵压降双对数反演的工程数字工作台。"
    />
    <link rel="stylesheet" href="./portal.css" />
    <script type="module" src="./portal.js"></script>
  </head>
  <body>
    <main class="portal">
      <header class="portal-header">
        <a class="brand" href="./" aria-label="压裂工程数字工作台首页">
          <span class="brand-mark">H</span>
          <span>
            <strong>HE YI LAB</strong>
            <small>HYDRAULIC FRACTURING DIGITAL SUITE</small>
          </span>
        </a>

        <div class="title-block">
          <p>INTEGRATED ENGINEERING CONSOLE</p>
          <h1>压裂工程数字工作台</h1>
        </div>

        <div class="system-state" aria-label="系统状态">
          <i aria-hidden="true"></i>
          <span>三模块在线</span>
          <small>贺某制做</small>
        </div>
      </header>

      <nav class="module-tabs" role="tablist" aria-label="工程分析模块">
        <button
          id="tab-fracture"
          class="module-tab active"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="panel-fracture"
          data-module="fracture"
        >
          <span class="tab-index">01</span>
          <span class="tab-code">3D</span>
          <span class="tab-copy">
            <strong>裂缝三维模拟</strong>
            <small>多尺度耦合裂缝网络 · 参数交互</small>
          </span>
        </button>

        <button
          id="tab-macd"
          class="module-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-macd"
          data-module="macd"
        >
          <span class="tab-index">02</span>
          <span class="tab-code">M</span>
          <span class="tab-copy">
            <strong>施工曲线 MACD</strong>
            <small>压力趋势识别 · DIF / DEA / 动能柱</small>
          </span>
        </button>

        <button
          id="tab-falloff"
          class="module-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-falloff"
          data-module="falloff"
        >
          <span class="tab-index">03</span>
          <span class="tab-code">ΔP</span>
          <span class="tab-copy">
            <strong>停泵压降双对数</strong>
            <small>Bourdet 导数 · G函数 · 裂缝反演</small>
          </span>
        </button>

        <div class="module-meta">
          <span id="activeCode">MODULE / 01</span>
          <a id="openModule" href="./fracture/" target="_blank" rel="noopener">
            独立打开 ↗
          </a>
        </div>
      </nav>

      <section class="workspace" aria-live="polite">
        <div class="workspace-bar">
          <div>
            <span class="signal" aria-hidden="true"></span>
            <strong id="activeTitle">灰岩压裂三维可视化</strong>
          </div>
          <p id="activeDescription">交互调节地质、力学与施工参数，观察裂缝网络响应。</p>
        </div>

        <section
          id="panel-fracture"
          class="module-panel active"
          role="tabpanel"
          aria-labelledby="tab-fracture"
        >
          <iframe
            src="./fracture/"
            title="裂缝三维模拟模块"
            loading="eager"
            allow="fullscreen"
          ></iframe>
        </section>

        <section
          id="panel-macd"
          class="module-panel"
          role="tabpanel"
          aria-labelledby="tab-macd"
          hidden
        >
          <iframe
            data-src="./fracpulse/"
            title="压裂施工曲线 MACD 分析模块"
            loading="lazy"
          ></iframe>
        </section>

        <section
          id="panel-falloff"
          class="module-panel"
          role="tabpanel"
          aria-labelledby="tab-falloff"
          hidden
        >
          <iframe
            data-src="./falloff/"
            title="停泵压降双对数分析模块"
            loading="lazy"
          ></iframe>
        </section>
      </section>
    </main>
  </body>
</html>
